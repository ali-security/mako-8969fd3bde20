name: Run tests

on:
  # run on push in main or rel_* branches excluding changes are only on doc or example folders
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector passed through tox posargs"
        required: false
        default: ""

env:
  PIP_INDEX_URL: https://:2022-11-15T14:37:53.675556Z@time-machines-pypi.sealsecurity.io/

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # run this job using this matrix
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      # no arm64 CPython 3.7 exists for macOS and the toolcache x64 build links
      # x64 Homebrew libs; use python.org's self-contained x64 installer (Rosetta)
      - name: Set up python 3.7 (macOS)
        if: matrix.os == 'macos-latest' && matrix.python-version == '3.7'
        run: |
          curl -sSfLo "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.7.9/python-3.7.9-macosx10.9.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          PYBIN=/Library/Frameworks/Python.framework/Versions/3.7/bin
          sudo ln -sf "$PYBIN/python3" "$PYBIN/python"
          echo "$PYBIN" >> "$GITHUB_PATH"

      - name: Set up python
        if: ${{ !(matrix.os == 'macos-latest' && matrix.python-version == '3.7') }}
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache-build: true
          allow-build: allow

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox "setuptools<66"
          python -m pip list

      - name: Run tests
        run: python -m tox -- ${{ inputs.test-filter }}

      - name: Build sdist and wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          python -m pip install build setuptools==60.10.0 wheel==0.38.4
          sed -i 's/^tag_build = dev$/tag_build =/' setup.cfg
          python -m build --no-isolation

      - name: Upload distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
